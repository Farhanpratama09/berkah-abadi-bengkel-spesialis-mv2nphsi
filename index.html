<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berkah Abadi — Bengkel Spesialis Motor Otomatis & Manual</title>
<meta name="description" content="Berkah Abadi, bengkel motor spesialis CVT, oli, rem, dan bodi di Jakarta. Garansi servis, mekanik bersertifikat, datang hari ini.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        carbon: '#0c0d10',
        base: '#111217',
        surface: '#181a20',
        panel: '#1d2027',
        line: '#2a2e38',
        ember: '#f97316',
        emberdeep: '#c2410c',
        flame: '#fb923c',
        brass: '#f2c14e',
        mist: '#a8aeba',
        ink: '#0a0b0d'
      },
      fontFamily: {
        display: ['Sora','sans-serif'],
        body: ['Inter','sans-serif']
      }
    }
  }
}
</script>
<style>
  :root{
    --carbon:#0c0d10; --base:#111217; --surface:#181a20; --panel:#1d2027;
    --line:#2a2e38; --ember:#f97316; --emberdeep:#c2410c; --flame:#fb923c;
    --brass:#f2c14e; --text:#eef1f5; --mist:#a8aeba; --ink:#0a0b0d;
  }
  .dark{
    --carbon:#f1f1ee; --base:#e9e8e3; --surface:#ffffff; --panel:#f6f5f1;
    --line:#dcdad2; --text:#14161b; --mist:#5c6068;
  }
  html{scroll-behavior:smooth}
  body{background:var(--base);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden}
  .font-display{font-family:'Sora',sans-serif}
  h1,h2,h3,h4,.display{font-family:'Sora',sans-serif;letter-spacing:-0.02em;line-height:1.08}
  .theme-swap{transition:background-color .5s ease,color .4s ease,border-color .5s ease}
  section{scroll-margin-top:84px}
  .text-strong{font-weight:800}
  .font-600{font-weight:600}
